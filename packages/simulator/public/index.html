<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1b3a" />
    <title>Recall Guardian · Alexa+ simulator</title>
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/img/echo-off-1672.webp" imagesrcset="/img/echo-off-960.webp 960w, /img/echo-off-1672.webp 1672w" imagesizes="100vw" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="stage" id="stage">
      <!-- The Echo Dot photos are stacked with identical framing; opacity changes move the light ring. -->
      <div class="scene" id="scene" data-ring="idle" aria-hidden="true">
        <img class="layer l-off" src="/img/echo-off-1672.webp" srcset="/img/echo-off-960.webp 960w, /img/echo-off-1672.webp 1672w" sizes="100vw" alt="" decoding="async" />
        <img class="layer l-listening" src="/img/echo-listening-1672.webp" srcset="/img/echo-listening-960.webp 960w, /img/echo-listening-1672.webp 1672w" sizes="100vw" alt="" decoding="async" />
        <img class="layer l-think1" src="/img/echo-thinking1-1672.webp" srcset="/img/echo-thinking1-960.webp 960w, /img/echo-thinking1-1672.webp 1672w" sizes="100vw" alt="" decoding="async" />
        <img class="layer l-think2" src="/img/echo-thinking2-1672.webp" srcset="/img/echo-thinking2-960.webp 960w, /img/echo-thinking2-1672.webp 1672w" sizes="100vw" alt="" decoding="async" />
      </div>
      <div class="scrim" aria-hidden="true"></div>

      <section class="convo" aria-label="Conversation">
        <ol id="transcript" class="transcript" aria-live="polite"></ol>
      </section>

      <aside class="panel" id="panel" aria-label="Recall Guardian">
        <header class="panel-head">
          <img class="logo" src="/img/logo.svg" alt="" width="40" height="44" />
          <h1>Recall Guardian</h1>
          <button id="menu-button" class="chevron" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu" aria-label="Demo menu">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </header>
        <div id="menu" class="menu" role="menu" hidden>
          <button id="demo-seed" type="button" role="menuitem" hidden>Load sample family</button>
          <button id="demo-recall" type="button" role="menuitem" hidden>Simulate new recall</button>
          <button id="reset" type="button" role="menuitem">Reset demo</button>
          <label class="switch">
            <input id="speak-toggle" type="checkbox" checked />
            <span>Speak replies</span>
          </label>
        </div>
        <ul id="inventory" class="household" aria-label="Your household"></ul>
      </aside>

      <p id="notice" class="notice" role="status" hidden></p>
      <p id="status" class="status" aria-live="polite"></p>

      <form id="composer" class="composer" autocomplete="off">
        <button id="mic" type="button" class="mic" aria-pressed="false" aria-label="Talk to Alexa" title="Talk to Alexa">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2Z" /></svg>
        </button>
        <label class="sr-only" for="message">Message</label>
        <input id="message" name="message" type="text" placeholder="Text to simulate your voice…" maxlength="500" />
        <button id="send" type="submit" class="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
      </form>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
