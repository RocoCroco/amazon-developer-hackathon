<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recall Guardian · Alexa+ simulator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="ring" id="ring" aria-hidden="true"></span>
        <div>
          <h1>Alexa+ <span class="tag">simulator</span></h1>
          <p>Recall Guardian · talking to a real MCP server</p>
        </div>
      </div>
      <div class="controls">
        <label class="switch" title="Hear Alexa's replies">
          <input id="speak-toggle" type="checkbox" checked />
          <span>Speak replies</span>
        </label>
        <button id="demo-seed" type="button" class="ghost" hidden>Load sample family</button>
        <button id="demo-recall" type="button" class="ghost" hidden>Simulate new recall</button>
        <button id="reset" type="button" class="ghost">Reset demo</button>
      </div>
    </header>

    <main class="layout">
      <section class="chat" aria-label="Conversation">
        <ol id="transcript" class="transcript" aria-live="polite">
          <li class="bubble alexa">
            Hi, I'm Alexa. Tell me about something your family owns, like a car seat or a heater,
            and I'll watch for recalls.
          </li>
        </ol>
        <p id="status" class="status" aria-live="polite"></p>
        <form id="composer" class="composer" autocomplete="off">
          <button
            id="mic"
            type="button"
            class="mic"
            aria-pressed="false"
            aria-label="Talk to Alexa"
            title="Talk to Alexa"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2Z"
              />
            </svg>
          </button>
          <label class="sr-only" for="message">Message</label>
          <input
            id="message"
            name="message"
            type="text"
            placeholder="Talk, or type what you'd say to Alexa…"
            maxlength="500"
          />
          <button id="send" type="submit">Send</button>
        </form>
      </section>

      <aside class="side">
        <section class="panel" aria-labelledby="inv-title">
          <h2 id="inv-title">Your household</h2>
          <ul id="inventory" class="inventory">
            <li class="empty">Nothing registered yet.</li>
          </ul>
        </section>
        <section class="panel" aria-labelledby="alerts-title">
          <h2 id="alerts-title">Alerts</h2>
          <ul id="alerts" class="inventory">
            <li class="empty">No alerts.</li>
          </ul>
        </section>
      </aside>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
